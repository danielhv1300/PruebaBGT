services:
  mongodb:
    image: mongo:latest
    container_name: btg_pactual_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=btg_fondos
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: